name: OriCode macOS Build
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - name: npm ci (con reintento)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm ci || npm ci
        timeout-minutes: 45
      - name: Dictation runtime stamp
        run: npx tsx build/dictation-runtime/produce.ts --vscode-platform=darwin --arch=arm64
      - name: Build OriCode (arm64)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DICTATION_RUNTIME_RESULTS_FILE: '.build/dictation-runtime/darwin-arm64.json'
          SKIP_NODE_COMPILE_CACHE: '1'
        run: npx gulp vscode-darwin-arm64-min
        timeout-minutes: 120
      - name: Crear DMG
        run: |
          brew install create-dmg
          create-dmg             --volname "OriCode"             --window-pos 200 120             --window-size 660 400             --icon-size 100             --icon "OriCode.app" 160 185             --hide-extension "OriCode.app"             --app-drop-link 500 185             "oricode-mac-arm64.dmg"             "../VSCode-darwin-arm64/OriCode.app" || true
          if [ ! -f oricode-mac-arm64.dmg ]; then
            hdiutil create -volname OriCode -srcfolder "../VSCode-darwin-arm64/OriCode.app" -ov -format UDZO oricode-mac-arm64.dmg
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: oricode-mac-arm64
          path: oricode-mac-arm64.dmg
